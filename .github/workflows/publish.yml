name: Publish
on:
  workflow_dispatch:
    inputs:
      git2:
        description: "Publish git2"
        type: boolean
        default: true
      git2_curl:
        description: "Publish git2-curl"
        type: boolean
        default: true
      libgit2_sys:
        description: "Publish libgit2-sys"
        type: boolean
        default: true
      publish-ref:
        description: "Branch/tag/SHA to publish from"
        type: string
        default: main

permissions: {}

jobs:
  publish:
    name: Publish to crates.io
    runs-on: ubuntu-latest
    environment: publish
    permissions:
      contents: write # Required by `ci/publish.sh` to push the release tag.
      id-token: write # Required by `rust-lang/crates-io-auth-action` to obtain the crates.io token via OIDC.
    steps:
      - uses: actions/checkout@master
        with:
          submodules: true
          ref: ${{ inputs.publish-ref }}
      - uses: rust-lang/crates-io-auth-action@v1
        id: auth
      - name: Publish
        env:
          CARGO_REGISTRY_TOKEN: ${{ steps.auth.outputs.token }}
          PUBLISH_GIT2: ${{ inputs.git2 }}
          PUBLISH_GIT2_CURL: ${{ inputs.git2_curl }}
          PUBLISH_LIBGIT2_SYS: ${{ inputs.libgit2_sys }}
        run: ./ci/publish.sh
