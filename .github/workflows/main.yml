name: CI
on:
  pull_request:
  merge_group:

jobs:
  test:
    name: Test
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        build: [stable, beta, nightly, macos, windows, MSRV]
        include:
          - build: stable
            os: ubuntu-latest
            rust: stable
          - build: beta
            os: ubuntu-latest
            rust: beta
          - build: nightly
            os: ubuntu-latest
            rust: nightly
          # 1.87 is the minimum supported per Cargo.toml
          - build: MSRV
            os: ubuntu-latest
            rust: "1.87"
          - build: macos
            os: macos-latest
            rust: stable
          - build: windows
            os: windows-latest
            rust: stable
    steps:
    - uses: actions/checkout@master
      with:
        submodules: true
    - name: Install Rust (rustup)
      run: rustup update ${{ matrix.rust }} --no-self-update && rustup default ${{ matrix.rust }}
      shell: bash
    - run: cargo test --locked
    - run: cargo test --features https,ssh
    # Single-threaded: libgit2's builtin SHA256 is not thread-safe.
    # See https://github.com/rust-lang/git2-rs/issues/1255.
    - run: cargo test --features unstable-sha256 -- --test-threads=1
    - run: cargo test --features https,ssh,unstable-sha256
    - run: cargo test -p git2-curl
    - run: cargo run -p systest
    - run: cargo run -p systest --features unstable-sha256

  clippy:
    name: Clippy
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        build: [stable, beta, windows]
        include:
          - build: stable
            os: ubuntu-latest
            rust: stable
          - build: beta
            os: ubuntu-latest
            rust: beta
          - build: windows
            os: windows-2022
            rust: stable
    steps:
    - uses: actions/checkout@master
      with:
        submodules: true
    - name: Install Rust (rustup)
      run: rustup update ${{ matrix.rust }} --no-self-update && rustup default ${{ matrix.rust }}
      shell: bash
    - name: Install Clippy (rustup)
      run: rustup component add clippy
    - run: cargo clippy --all-targets --all-features -- -Dwarnings

  wasi:
    name: WASI
    runs-on: ubuntu-latest
    strategy:
      matrix:
        build: [stable, beta, nightly, MSRV]
        include:
          - build: stable
            rust: stable
          - build: beta
            rust: beta
          - build: nightly
            rust: nightly
          - build: MSRV
            rust: "1.87"
    env:
      WASI_SDK_VERSION: 34
      WASMTIME_VERSION: 49.0.2
    steps:
    - uses: actions/checkout@master
      with:
        submodules: true
    - name: Install Rust (rustup)
      run: rustup update ${{ matrix.rust }} --no-self-update && rustup default ${{ matrix.rust }} && rustup target add wasm32-wasip1
    - name: Install wasi-sdk
      run: |
        curl -fsSL https://github.com/WebAssembly/wasi-sdk/releases/download/wasi-sdk-${WASI_SDK_VERSION}/wasi-sdk-${WASI_SDK_VERSION}.0-x86_64-linux.tar.gz | tar xz
        echo "CC_wasm32_wasip1=$PWD/wasi-sdk-${WASI_SDK_VERSION}.0-x86_64-linux/bin/clang" >> $GITHUB_ENV
        echo "AR_wasm32_wasip1=$PWD/wasi-sdk-${WASI_SDK_VERSION}.0-x86_64-linux/bin/llvm-ar" >> $GITHUB_ENV
    - name: Install wasmtime
      run: |
        curl -fsSL https://github.com/bytecodealliance/wasmtime/releases/download/v${WASMTIME_VERSION}/wasmtime-v${WASMTIME_VERSION}-x86_64-linux.tar.xz | tar xJ
        echo "$PWD/wasmtime-v${WASMTIME_VERSION}-x86_64-linux" >> $GITHUB_PATH
    # Before Rust 1.94, std on WASI can't canonicalize paths and its
    # remove_dir_all fails on the directories the tests create, so MSRV only
    # builds.
    - run: cargo build --locked --target wasm32-wasip1 --features vendored-libgit2
      if: matrix.build == 'MSRV'
    - run: cargo test --locked --target wasm32-wasip1 --features vendored-libgit2
      if: matrix.build != 'MSRV'
      env:
        CARGO_TARGET_WASM32_WASIP1_RUNNER: wasmtime run --dir /tmp

  rustfmt:
    name: Rustfmt
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@master
    - name: Install Rust
      run: rustup update stable && rustup default stable && rustup component add rustfmt
    - run: cargo fmt -- --check

  # The success job is here to consolidate the total success/failure state of
  # all other jobs. This job is then included in the GitHub branch protection
  # rule which prevents merges unless all other jobs are passing. This makes
  # it easier to manage the list of jobs via this yml file and to prevent
  # accidentally adding new jobs without also updating the branch protections.
  success:
    name: Success gate
    if: always()
    needs:
      - test
      - wasi
      - rustfmt
    runs-on: ubuntu-latest
    steps:
      - run: jq --exit-status 'all(.result == "success")' <<< '${{ toJson(needs) }}'
      - name: Done
        run: exit 0
